# Déploiement Render (site statique) — Yves.DEV
services:
  - type: web
    name: yves-dev
    runtime: static
    buildCommand: npm ci && npm run check
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # - key: VITE_SITE_URL      # décommentez avec votre adresse publique
      #   value: https://yves-dev.onrender.com
    routes:
      # Les pages (/projets/…, /cookies…) sont gérées par React : on renvoie index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - { path: /*, name: Strict-Transport-Security, value: "max-age=63072000; includeSubDomains; preload" }
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: X-Frame-Options, value: DENY }
      - { path: /*, name: Referrer-Policy, value: strict-origin-when-cross-origin }
      - { path: /*, name: Permissions-Policy, value: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" }
      - { path: /*, name: Cross-Origin-Opener-Policy, value: same-origin }
      - { path: /*, name: Cross-Origin-Resource-Policy, value: same-origin }
      - { path: /*, name: Content-Security-Policy, value: "frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" }
      - { path: /assets/*, name: Cache-Control, value: "public, max-age=31536000, immutable" }
